# MPPI distance planning for the side-by-side model comparison.
# Same as planning_mppi.yaml but: stop episodes as soon as the goal is reached
# (clean "solve" gifs) and always save per-episode gifs to stitch later.
logging:
  tqdm_silent: false
  save_gif: true
task_specification:
  goal_source: random_state   # generate (start, goal) per episode
  obs: rgb
  stop_on_success: true       # end the episode the instant the ball reaches the goal
planner:
  planner_name: mppi
  num_act_stepped: 1
  plan_length: 90             # MPPI imagination horizon
  n_iters: 20
  num_samples: 200
  num_elites: 20
  max_norms:
    - 2.45
  max_norm_dims:
    - 0
    - 1
  var_scale: 1.5
  decode_each_iteration: false
  planning_objective:
    objective_type: repr_dist  # distance-in-latent (the baseline objective)
    sum_all_diffs: true
    alpha: 0.
ctxt_window_time: 1
